apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    tier: db
    component: mongodb
spec:
  selector:
    project: roboshop
    environment: dev
    tier: db
    component: mongodb

  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017